# Release pipeline: on a v* tag, build .deb + .rpm for x86_64 and arm64 (native
# runners — avoids cross-compiling the bundled DuckDB C++), then publish a
# GitHub Release whose body is the matching CHANGELOG section, with the packages
# attached.
#
# Every action is pinned to a full commit SHA (the version is in the trailing
# comment) so a moved or hijacked tag can't change what runs here; Dependabot
# (.github/dependabot.yml) proposes updates to the pins.
name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default; only the publish job below may write to the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      # The DB-IP Lite country database is compiled into the binary
      # (include_bytes! in src/geo.rs). DB-IP republishes it monthly, so each
      # release embeds the newest edition rather than whatever was committed.
      # The checked-in copy is the fallback: a failed or corrupt download must
      # never fail a release, it just ships a slightly older database.
      - name: Refresh bundled geolocation database
        run: |
          set -uo pipefail
          asset="assets/geo/dbip-country-lite.mmdb"
          # The current month appears a day or two into the month, so fall back
          # to the previous one.
          for month in "$(date -u +%Y-%m)" "$(date -u -d '1 month ago' +%Y-%m)"; do
            url="https://download.db-ip.com/free/dbip-country-lite-${month}.mmdb.gz"
            echo "::group::Trying ${url}"
            # --proto/--proto-redir: never fall back to plain HTTP, even on a redirect.
            if curl -fsSL --proto '=https' --proto-redir '=https' --max-time 180 \
                 -o /tmp/geo.mmdb.gz "$url" \
               && gunzip -f /tmp/geo.mmdb.gz; then
              size=$(stat -c%s /tmp/geo.mmdb)
              # A truncated download or an HTML error page would still gunzip to
              # something; require a plausible size and MaxMind's metadata
              # marker before letting it replace the committed database.
              if [ "$size" -gt 4000000 ] \
                 && grep -qa $'\xab\xcd\xefMaxMind.com' /tmp/geo.mmdb; then
                mv /tmp/geo.mmdb "$asset"
                echo "Embedding DB-IP Lite ${month} (${size} bytes)"
                echo "::endgroup::"
                exit 0
              fi
              echo "Rejected ${month}: failed validation (${size} bytes)"
            fi
            echo "::endgroup::"
          done
          echo "::warning::Could not refresh the geolocation database; embedding the committed copy ($(stat -c%s "$asset") bytes)"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Strip binary
        run: strip target/release/easylog

      - name: Build .deb
        run: cargo deb --no-build

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Collect packages
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release and upload the packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: EasyLog ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true
